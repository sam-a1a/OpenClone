org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# R8 in full mode: more aggressive optimization and shrinking than compat mode.
android.enableR8.fullMode=true

# Only package the resource types this app actually uses. Non-final IDs are
# required by R8's optimized resource shrinking, which is what actually strips
# the unused AndroidX resources.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
